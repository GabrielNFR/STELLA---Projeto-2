name: CI/CD — Stella

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes-backend:
    name: Testes Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r backend/requirements.txt

      - name: Executar testes
        working-directory: backend
        run: python manage.py test tratamento --verbosity=2

  deploy-backend:
    name: Deploy Backend — Azure App Service
    needs: testes-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Coletar arquivos estáticos
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py collectstatic --noinput
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: 'False'

      - name: Deploy para Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend

  deploy-frontend:
    name: Deploy Frontend — Azure Static Web Apps
    needs: testes-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy para Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

  testes-e2e:
    name: Testes E2E (Selenium)
    needs: [deploy-backend, deploy-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências E2E
        run: pip install -r e2e/requirements.txt

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Executar testes E2E
        working-directory: e2e
        run: pytest --verbosity=2
        env:
          STELLA_URL: ${{ secrets.STELLA_FRONTEND_URL }}
